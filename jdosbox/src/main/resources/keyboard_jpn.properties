# JPN (JIS) keyboard layout for jDOSBox
# @ key: JIS has @ as a direct key, US needs Shift+2
200=03,+shift

# ^ key: JIS has ^ as a direct key, US needs Shift+6
202=07,+shift

# : key: JIS has : as a direct key, US needs Shift+;
201=27,+shift

# _ key (VK_UNDERSCORE 0x20b): JIS has \ unshifted, _ shifted. US needs \ unshifted, Shift+- for _
20b=2b
20b,+shift=0c,+shift

# --- macOS AWT specific positional mappings for JIS (Apple Magic Keyboard) ---

# JIS @ (right of P). Mac VK: VK_OPEN_BRACKET (5b)
5b=03,+shift
5b,+shift=29,-shift

# JIS ^ (right of -). Mac VK: VK_EQUALS (3d)
3d=07,+shift
3d,+shift=29

# JIS : (right of ;). Mac VK: VK_QUOTE (de)
de=27,+shift
de,+shift=09

# --- JIS shifted keys ---

# Shift+2 -> " (US Shift+')
32,+shift=28
98=28
98,+shift=28

# Shift+6 -> & (US Shift+7)
36,+shift=08
96=08
96,+shift=08

# Shift+7 -> ' (US ' unshifted)
37,+shift=28,-shift

# Shift+8 -> ( (US Shift+9)
38,+shift=0a

# Shift+9 -> ) (US Shift+0)
39,+shift=0b

# Shift+- -> = (US = unshifted)
2d,+shift=0d,-shift

# Shift+^ (VK_CIRCUMFLEX) -> ~ (US Shift+`)
202,+shift=29

# Shift+@ (VK_AT) -> ` (US ` unshifted)
200,+shift=29,-shift

# Shift+; -> + (US Shift+=)
3b,+shift=0d
209=0d
209,+shift=0d

# Shift+: (VK_COLON) -> * (US Shift+8)
201,+shift=09
97=09
97,+shift=09

# --- Keys mapped to their US positional equivalents on Mac ---
# Mac AWT maps JIS [ to VK_CLOSE_BRACKET (5d)
5d=1a
5d,+shift=1a

# Mac AWT maps JIS ] to VK_BACK_SLASH (5c)
5c=1b
5c,+shift=1b

# Mac AWT maps JIS \ (Yen) to VK_YEN (9d) or similar. Map it to \
9d,+shift=5f

# TODO mac magic keyboard2 key "]" and "¥" both return keycode 92 ???

# Shift+0 is blank so assign '|' TODO doesn't work
30,+shift=5c,+shift
